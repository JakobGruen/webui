name: Green-wald release

# Builds webui.zip (upsell-free, see GREEN-WALD.md) and attaches it to a
# release when a gw-* tag is pushed. Upstream's own build.yml (v*.*.*) is
# left untouched and does not fire on these tags.
on:
  push:
    tags:
      - 'gw-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npx eslint src/

      - run: npm run build

      - name: Create webui.zip
        working-directory: dist
        run: zip -r ../webui.zip .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum webui.zip
          gh release create "$TAG" webui.zip --verify-tag --title "Green-wald WebUI $TAG" \
            --notes "Stalwart WebUI build without Enterprise upsell prompts. Patch and rationale: GREEN-WALD.md. Source: $GITHUB_SHA."
